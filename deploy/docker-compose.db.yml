# 紫微斗数解读数据集的数据库
#
#   docker compose -f deploy/docker-compose.db.yml up -d
#
# 只绑 127.0.0.1，不对外暴露；密码走环境变量 ZIWEI_DB_PASSWORD。
services:
  ziwei-postgres:
    image: postgres:16
    container_name: ziwei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ziwei
      POSTGRES_PASSWORD: ${ZIWEI_DB_PASSWORD:-ziwei_dev_pwd}
      POSTGRES_DB: ziwei
      TZ: Asia/Shanghai
    volumes:
      - ziwei-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=256MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - effective_cache_size=8GB

volumes:
  ziwei-pgdata:
